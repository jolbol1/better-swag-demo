  labels:
    opentelemetry.io/name: flagd
    app.kubernetes.io/component: flagd
    app.kubernetes.io/name: flagd
    app.kubernetes.io/version: 2.0.2
    app.kubernetes.io/part-of: opentelemetry-demo
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      opentelemetry.io/name: flagd
  template:
    metadata:
      labels:
        opentelemetry.io/name: flagd
        app.kubernetes.io/component: flagd
        app.kubernetes.io/name: flagd
    spec:
      serviceAccountName: opentelemetry-demo
      containers:
      - name: flagd
        image: ghcr.io/open-feature/flagd:v0.12.8
        imagePullPolicy: Always
        command:
        - "/flagd-build"
        - start
        - "--port"
        - '8013'
        - "--ofrep-port"
        - '8016'
        - "--uri"
        - file:./etc/flagd/demo.flagd.json
        ports:
        - containerPort: 8013
          name: rpc
        - containerPort: 8016
          name: ofrep
        env:
        - name: FLAGD_METRICS_EXPORTER
          value: otel
        - name: FLAGD_OTEL_COLLECTOR_URI
          value: "$(OTEL_COLLECTOR_NAME):4317"
        resources:
          limits:
            memory: 75Mi
        volumeMounts:
        - name: config-rw
          mountPath: "/etc/flagd"
      - name: flagd-ui
        image: betterstack/opentelemetry-demo:latest-flagd-ui
        imagePullPolicy: Always
        ports:
        - containerPort: 4000
          name: service
        env:
        - name: FLAGD_METRICS_EXPORTER
          value: otel
        resources:
          limits:
            memory: 100Mi
        volumeMounts:
        - mountPath: "/app/data"
          name: config-rw
      initContainers:
      - command:
        - sh
        - "-c"
        - |
          cp /config-ro/demo.flagd.json /config-rw/demo.flagd.json
          chmod 666 /config-rw/demo.flagd.json
          cat /config-rw/demo.flagd.json
        image: busybox
        name: init-config
        volumeMounts:
        - mountPath: "/config-ro"
          name: config-ro
        - mountPath: "/config-rw"
          name: config-rw
      volumes:
      - name: config-rw
        emptyDir: {}
      - configMap:
          name: flagd-config
        name: config-ro
