apiVersion: apps/v1
kind: Deployment
metadata:
  name: accounting
  namespace: otel-demo
  labels:
    opentelemetry.io/name: accounting
    app.kubernetes.io/component: accounting
    app.kubernetes.io/name: accounting
    app.kubernetes.io/version: 2.0.2
    app.kubernetes.io/part-of: opentelemetry-demo
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      opentelemetry.io/name: accounting
  template:
    metadata:
      labels:
        opentelemetry.io/name: accounting
        app.kubernetes.io/component: accounting
        app.kubernetes.io/name: accounting
    spec:
      serviceAccountName: opentelemetry-demo
      containers:
      - name: accounting
        image: betterstack/opentelemetry-demo:latest-accounting
        imagePullPolicy: Always
        env:
        - name: KAFKA_ADDR
          value: kafka:9092
        - name: DB_CONNECTION_STRING
          value: Host=postgresql;Username=otelu;Password=otelp;Database=otel
        resources:
          limits:
            memory: 120Mi
        volumeMounts:
      initContainers:
      - command:
        - sh
        - "-c"
        - until nc -z -v -w30 kafka 9092; do echo waiting for kafka; sleep 2; done;
        image: busybox:latest
        name: wait-for-kafka
      volumes:
